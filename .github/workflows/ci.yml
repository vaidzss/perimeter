name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-python:
    name: Python Test Suite & Seed Verification
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Seed test database
        run: |
          python frontend/bharatpay/seed/seed.py

      - name: Run complete test suite (130 tests)
        run: |
          python -m pytest -v

  build-frontend:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: ["20.x"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - name: Build SOC Dashboard
        working-directory: frontend/dashboard
        run: |
          npm ci
          npm run build

      - name: Build BharatPay Customer Portal
        working-directory: frontend/bharatpay/frontend
        run: |
          npm ci
          npm run build
